version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mcx_gold_rva_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mcx_gold_rva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcx_gold_rva_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/mcx_gold_rva
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
      ANNUAL_RISK_FREE_RATE: 0.065
      GOLD_STORAGE_INSURANCE_RATE: 0.005
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcx_gold_rva_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
